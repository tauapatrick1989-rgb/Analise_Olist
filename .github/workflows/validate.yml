name: Validar analise Olist

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Executar testes
        run: python -m unittest discover -s tests
      - name: Executar pipeline e validacoes
        run: python scripts/run_pipeline.py
      - name: Conferir resultado analitico
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          checks = pd.read_csv('reports/qualidade/validacao_bases_analiticas.csv')
          assert checks['status'].eq('ok').all()
          for name in ('comparativo_jan_jul.csv', 'entrega_e_avaliacao.csv', 'metricas_vendedores_top15.csv'):
              assert Path('reports/tabelas', name).is_file()
          PY
